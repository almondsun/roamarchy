"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#81a1c1)\
$os\
$username\
[](bg:#88c0d0 fg:#81a1c1)\
$directory\
[](fg:#88c0d0 bg:#8fbcbb)\
$git_branch\
$git_status\
[](fg:#8fbcbb bg:#a3be8c)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#a3be8c bg:#b48ead)\
$docker_context\
[](fg:#b48ead bg:#4c566a)\
$time\
[ ](fg:#4c566a)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#2e3440 bg:#81a1c1"
style_root = "fg:#2e3440 bg:#bf616a"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:#2e3440 bg:#81a1c1"
disabled = true # Disabled by default

[directory]
style = "fg:#2e3440 bg:#88c0d0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#2e3440 bg:#b48ead"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#2e3440 bg:#8fbcbb"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#2e3440 bg:#8fbcbb"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#2e3440 bg:#a3be8c"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#e5e9f0 bg:#4c566a"
format = '[ $time ]($style)'
